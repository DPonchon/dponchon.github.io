<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Sasa Cerámica">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="es-AR" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ site.locale | default: 'es_AR' }}">
  <meta property="og:site_name" content="Sasa Cerámica">
  <meta property="og:image" content="{{ page.og_image | default: '/images/preview.jpg?v=2' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.og_title | default: page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.og_description | default: page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ page.og_image | default: '/images/preview.jpg?v=2' | absolute_url }}">
  <meta name="twitter:image:alt" content="Sasa Cerámica — Rodillos texturadores artesanales para cerámica">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}">

  <!-- Google Analytics GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8PCR39MRTB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8PCR39MRTB');
  </script>

  <!-- Preconnect / DNS prefetch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.instagram.com">

  <!-- Google Fonts: Cormorant Garamond (display) + Nunito (body) — carga diferida para no bloquear render -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Nunito:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Nunito:wght@400;500;600;700&display=swap"></noscript>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/css/styles.css?v=22' | relative_url }}">

  <!-- Anti-flicker: aplica el tema e idioma antes de pintar la página -->
  <script>
    (function(){
      var t=localStorage.getItem('theme');
      if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
        document.documentElement.dataset.theme='dark';
      }
      if(localStorage.getItem('lang')==='en'){
        document.documentElement.dataset.lang='en';
      }
    })();
  </script>
</head>
<body>

  <a href="#main-content" class="skip-link">Ir al contenido principal</a>

{% include envios-bar.html %}

{% include header.html %}

  <!-- ═══════════════════════════════════════
       MAIN
       ═══════════════════════════════════════ -->
  <main id="main-content">
{{ content }}
  </main>

{% include footer.html %}

{% include schema-org.html %}

  <script src="{{ '/js/main.js?v=2' | relative_url }}"></script>
  <script src="{{ '/js/i18n.js?v=1' | relative_url }}"></script>

{% include wa-fab.html %}

</body>
</html>
